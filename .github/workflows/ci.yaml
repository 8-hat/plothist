# This workflow will install Python dependencies, run tests with a variety of Python versions
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: |
          uv sync --group dev --group test

      - name: Run prek
        run: |
          uv run prek run --all-files

      - name: Test with pytest
        run: |
          uv run python -m pytest -r sa --mpl --mpl-results-path=pytest_results -n auto

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: pytest_results-${{ matrix.python-version }}
          retention-days: 3
          path: pytest_results

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
